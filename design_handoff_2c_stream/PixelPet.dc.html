<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative; width: 40px; height: 40px">
  <div style="position: absolute; left: 3px; top: 0; width: 9px; height: 9px; background: {{ color }}"></div>
  <div style="position: absolute; right: 3px; top: 0; width: 9px; height: 9px; background: {{ color }}"></div>
  <div style="position: absolute; left: 0; top: 7px; width: 40px; height: 33px; background: {{ color }}"></div>
  <div style="position: absolute; left: 9px; top: 17px; width: 5px; height: 6px; background: #2b1b26"></div>
  <div style="position: absolute; right: 9px; top: 17px; width: 5px; height: 6px; background: #2b1b26"></div>
  <div style="position: absolute; left: 13px; top: 27px; width: 14px; height: 7px; background: {{ snout }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:40,&quot;height&quot;:40},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f2a0bc&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;snout&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d97d9d&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
