<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background: #171122; padding: 9px 12px 10px; display: flex; flex-direction: column; gap: 8px; font-family: 'Galmuri11', monospace">

  <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px">
    <div style="height: 34px; background: #ff7a6e; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #d61f24; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #ffc79c; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #ff8a1f; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #7a4a24; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #ffd21f; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #a8e05a; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #17a86b; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #6fd3f0; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #1f5bd6; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #c4a3f5; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #7a2ee0; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #ff8ac0; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #ffffff; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #9a9aa6; box-shadow: 0 0 0 2px #0f0a19"></div>
    <div style="height: 34px; background: #14101c; box-shadow: 0 0 0 3px #ff2e6a"></div>
  </div>

  <div style="display: flex; align-items: stretch; gap: 6px">
    <div style="display: flex; gap: 2px; padding: 3px; background: #241b34; flex: none">
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #1d1629">
        <div style="width: 6px; height: 6px; background: #f4ecff"></div>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #2f2440; box-shadow: inset 0 0 0 3px #ff2e6a">
        <div style="width: 12px; height: 12px; background: #f4ecff"></div>
      </div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #1d1629">
        <div style="width: 19px; height: 19px; background: #f4ecff"></div>
      </div>
    </div>

    <div style="flex: 1; min-width: 0; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #241b34; box-shadow: inset 0 0 0 3px #3a2d52">
      <div style="width: 18px; height: 9px; background: #ffffff; box-shadow: 0 3px 0 #ff9ec7"></div>
      <div style="font-size: 11px; color: #f4ecff">지우개</div>
    </div>

    <div style="flex: 1; min-width: 0; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #2f2440; box-shadow: inset 0 0 0 3px #4a3a5c">
      <div style="position: relative; width: 14px; height: 11px">
        <div style="position: absolute; left: 0; top: 4px; width: 14px; height: 3px; background: #f4ecff"></div>
        <div style="position: absolute; left: 0; top: 0; width: 6px; height: 3px; background: #f4ecff"></div>
        <div style="position: absolute; left: 0; top: 8px; width: 6px; height: 3px; background: #f4ecff"></div>
      </div>
      <div style="font-size: 11px; color: #f4ecff">이전으로</div>
    </div>

    <div style="flex: 1; min-width: 0; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #3a1226; box-shadow: inset 0 0 0 3px #ff2e6a">
      <div style="position: relative; width: 12px; height: 12px">
        <div style="position: absolute; left: 4px; top: 0; width: 4px; height: 12px; background: #ff86a8; transform: rotate(45deg)"></div>
        <div style="position: absolute; left: 4px; top: 0; width: 4px; height: 12px; background: #ff86a8; transform: rotate(-45deg)"></div>
      </div>
      <div style="font-size: 11px; color: #ffc4d5">전부지우기</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:140}}"></script>
</body>
</html>
