name: Keep Alive

# Render 무료 웹 서비스는 15분 동안 요청이 없으면 잠들고 깨는 데 약 1분이 걸린다.
# 10분마다 DB를 건드리지 않는 /ping을 호출해 깨워 둔다 (월 750시간 무료 한도 안에서 24시간 유지).
# 저장소 Variable SERVER_URL(예: https://sketch-catch-server.onrender.com)이 없으면 건너뛴다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.SERVER_URL != '' }}
    steps:
      - name: Ping server
        # 잠든 상태라면 깨어나는 데 1분 정도 걸리므로 넉넉히 기다리고 재시도한다
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 "${{ vars.SERVER_URL }}/ping"
